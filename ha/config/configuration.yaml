
# Loads default set of integrations. Do not remove.
default_config:

# Packages: one file per feature, each carrying its own automations, scripts
# and helpers. An instance onboarded through the UI has no `homeassistant:`
# block at all, and without this line `packages/` is never read -- the files
# load cleanly and do nothing.
homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# To limit the sd card usage
recorder:
  purge_keep_days: 7
  commit_interval: 30

